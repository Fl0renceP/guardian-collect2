<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guardian Collective - Plate Scan (Azure OCR)</title>
  <style>
    :root {
      --bg:#f6f7f9; --panel:#ffffff; --fg:#16181d; --muted:#666c78; --line:#e2e5ea;
      --alert:#b3261e; --alert-bg:#fdeceb; --ok:#186b3c; --ok-bg:#e9f6ee;
      --unknown:#7a5c00; --unknown-bg:#fdf5e0; --accent:#1c4fd8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#131519; --panel:#1b1e24; --fg:#e9eaee; --muted:#9aa1ad; --line:#2b3038;
        --alert:#ff9a92; --alert-bg:#3a1c1a; --ok:#7fd4a0; --ok-bg:#14301f;
        --unknown:#e8c86a; --unknown-bg:#312713; --accent:#8fb0ff;
      }
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      padding:24px 16px 64px;
      font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--fg);
    }
    .wrap { max-width:820px; margin:0 auto; }
    header { margin-bottom:20px; }
    h1 { font-size:21px; margin:0 0 4px; letter-spacing:-.01em; }
    .sub { color:var(--muted); font-size:13px; margin:0; }
    .sub a { color:var(--accent); }

    .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; }
    .pad { padding:18px; }

    #drop {
      border:2px dashed var(--line);
      border-radius:12px;
      padding:26px 18px;
      text-align:center;
      cursor:pointer;
      transition:border-color .15s, background .15s;
      background:var(--panel);
    }
    #drop:hover, #drop.over { border-color:var(--accent); }
    #drop p { margin:6px 0 0; color:var(--muted); font-size:13px; }
    #drop strong { font-size:15px; }
    #preview {
      display:none;
      max-height:220px;
      max-width:100%;
      border-radius:8px;
      margin-top:14px;
      border:1px solid var(--line);
    }
    input[type=file] { display:none; }

    button {
      font:inherit;
      font-weight:600;
      padding:11px 20px;
      border-radius:8px;
      cursor:pointer;
      background:var(--fg);
      color:var(--bg);
      border:1px solid var(--fg);
    }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .row { display:flex; gap:12px; align-items:center; margin-top:14px; flex-wrap:wrap; }

    #status { font-size:13px; color:var(--muted); min-height:20px; }
    .spin {
      display:inline-block;
      width:13px;
      height:13px;
      margin-right:7px;
      vertical-align:-2px;
      border:2px solid var(--line);
      border-top-color:var(--accent);
      border-radius:50%;
      animation:spin .7s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    #result { margin-top:20px; display:none; }
    .verdict { border-radius:12px; padding:18px; border:1px solid; margin-bottom:16px; }
    .verdict.alert   { background:var(--alert-bg);   border-color:var(--alert);   color:var(--alert); }
    .verdict.ok      { background:var(--ok-bg);      border-color:var(--ok);      color:var(--ok); }
    .verdict.unknown { background:var(--unknown-bg); border-color:var(--unknown); color:var(--unknown); }
    .verdict h2 { margin:0; font-size:19px; letter-spacing:-.01em; }
    .verdict .who { margin:8px 0 0; font-size:15px; font-weight:600; color:var(--fg); }
    .verdict .note { margin:6px 0 0; font-size:13px; color:var(--muted); }

    .badge {
      display:inline-block;
      font-size:11px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.05em;
      padding:3px 8px;
      border-radius:5px;
      vertical-align:2px;
      margin-left:8px;
    }
    .badge.offender,.badge.suspect { background:var(--alert); color:var(--panel); }
    .badge.verified { background:var(--ok); color:var(--panel); }

    h3 {
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.06em;
      color:var(--muted);
      margin:0 0 12px;
      font-weight:700;
    }
    .card + .card { margin-top:14px; }

    .kv {
      display:flex;
      justify-content:space-between;
      gap:14px;
      font-size:13px;
      padding:5px 0;
      border-bottom:1px solid var(--line);
    }
    .kv:last-child { border-bottom:0; }
    .kv span:first-child { color:var(--muted); }
    .kv span:last-child { font-variant-numeric:tabular-nums; text-align:right; }

    details { margin-top:14px; }
    summary { cursor:pointer; font-size:12px; color:var(--muted); }
    pre {
      background:var(--bg);
      border:1px solid var(--line);
      padding:11px;
      border-radius:8px;
      font-size:11px;
      overflow-x:auto;
      margin:8px 0 0;
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Plate Scan</h1>
    <p class="sub">Image to text with Azure OCR. <a href="/demos">All demos</a> · <a href="/test-scan">Facial Recognition</a> · <a href="/live">Live demo</a></p>
  </header>

  <div id="drop">
    <strong>Drop a plate photo here, or click to choose</strong>
    <p>Text is extracted and checked against the vehicle registry.</p>
    <img id="preview" alt="selected image preview">
  </div>
  <input id="file" type="file" accept="image/*">

  <div class="row">
    <button id="scan" disabled>Scan plate</button>
    <span id="status"></span>
  </div>

  <div id="result"></div>
</div>

<script>
  const fileEl = document.getElementById("file");
  const dropEl = document.getElementById("drop");
  const previewEl = document.getElementById("preview");
  const scanEl = document.getElementById("scan");
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("result");

  dropEl.addEventListener("click", () => fileEl.click());
  dropEl.addEventListener("dragover", e => { e.preventDefault(); dropEl.classList.add("over"); });
  dropEl.addEventListener("dragleave", () => dropEl.classList.remove("over"));
  dropEl.addEventListener("drop", e => {
    e.preventDefault();
    dropEl.classList.remove("over");
    if (e.dataTransfer.files.length) {
      fileEl.files = e.dataTransfer.files;
      showPreview();
    }
  });
  fileEl.addEventListener("change", showPreview);

  function showPreview() {
    const file = fileEl.files && fileEl.files[0];
    if (!file) return;
    previewEl.src = URL.createObjectURL(file);
    previewEl.style.display = "block";
    scanEl.disabled = false;
    statusEl.textContent = "";
    resultEl.style.display = "none";
  }

  const esc = value => String(value ?? "").replace(/[&<>"]/g,
    c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  const row = (key, value) => (value === undefined || value === null || value === "")
    ? "" : `<div class="kv"><span>${esc(key)}</span><span>${esc(value)}</span></div>`;

  function render(data, httpStatus, elapsed) {
    resultEl.style.display = "block";

    const success = data && data.success !== false && !data.error;
    const hasMatch = success && data.match_found && data.plate;
    const plateStatus = hasMatch ? String(data.plate.status || "").toLowerCase() : "";

    let cls = "unknown";
    let heading = "Plate scan could not be completed";
    let who = "";
    let note = data.error || data.message || "The scan failed before a verdict could be produced.";

    if (hasMatch && (plateStatus === "offender" || plateStatus === "suspect")) {
      cls = "alert";
      heading = `\u26A0 ${plateStatus.toUpperCase()} VEHICLE DETECTED`;
      who = `${esc(data.plate.plate_number)}<span class="badge ${esc(plateStatus)}">${esc(plateStatus)}</span>`;
      note = data.message || "This vehicle is flagged in the registry. Alert conditions met.";
    } else if (hasMatch && plateStatus === "verified") {
      cls = "ok";
      heading = "\u2713 Verified vehicle";
      who = `${esc(data.plate.plate_number)}<span class="badge verified">verified</span>`;
      note = data.message || "Known vehicle matched with verified status.";
    } else if (success && !data.match_found) {
      cls = "unknown";
      heading = "Plate not in registry";
      note = data.message || "The plate text was read but no registered vehicle matched.";
    }

    const detailsBlock = `
      <div class="card pad">
        <h3>Scan details</h3>
        ${row("Extracted plate text", data.extracted_text)}
        ${row("Matched plate", hasMatch ? data.plate.plate_number : null)}
        ${row("Owner", hasMatch ? data.plate.owner_name : null)}
        ${row("Status", hasMatch ? plateStatus : "unknown")}
        ${row("Match type", data.match_type)}
        ${row("OCR confidence", data.confidence)}
        ${row("Provider", data.provider)}
        ${row("Time taken", elapsed + " s")}
        ${row("HTTP status", httpStatus)}
      </div>`;

    resultEl.innerHTML = `
      <div class="verdict ${cls}">
        <h2>${heading}</h2>
        ${who ? `<p class="who">${who}</p>` : ""}
        <p class="note">${esc(note)}</p>
      </div>
      ${detailsBlock}
      <details><summary>Raw response</summary><pre>${esc(JSON.stringify(data, null, 2))}</pre></details>`;
  }

  scanEl.addEventListener("click", async () => {
    if (!fileEl.files || !fileEl.files.length) {
      statusEl.textContent = "Pick an image first.";
      return;
    }

    scanEl.disabled = true;
    statusEl.innerHTML = '<span class="spin"></span>Reading plate text with Azure OCR...';
    resultEl.style.display = "none";

    const started = performance.now();
    const formData = new FormData();
    formData.append("file", fileEl.files[0]);

    try {
      const response = await fetch("/api/v1/scan-plate-azure", {
        method: "POST",
        body: formData
      });
      const data = await response.json();
      const elapsed = ((performance.now() - started) / 1000).toFixed(2);

      statusEl.textContent = `Status: ${response.status} ${response.ok ? "OK" : "Error"}`;
      render(data, response.status, elapsed);
    } catch (error) {
      const elapsed = ((performance.now() - started) / 1000).toFixed(2);
      statusEl.textContent = "Request failed.";
      render({ error: String(error), success: false }, "network", elapsed);
    } finally {
      scanEl.disabled = false;
    }
  });
</script>
</body>
</html>
