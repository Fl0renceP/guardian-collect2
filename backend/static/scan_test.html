<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face Scan Test</title>
</head>
<body>
  <h1>Face Scan Test</h1>
  <form id="scan-form">
    <label for="file">Photo:</label>
    <input id="file" name="file" type="file" accept="image/*" required>
    <button type="submit">Upload and Scan</button>
  </form>

  <p id="status"></p>
  <pre id="result"></pre>

  <script>
    const form = document.getElementById("scan-form");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const fileInput = document.getElementById("file");
      if (!fileInput.files || !fileInput.files.length) {
        statusEl.textContent = "Please choose a file first.";
        resultEl.textContent = "";
        return;
      }

      statusEl.textContent = "Uploading...";
      resultEl.textContent = "";

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      try {
        const response = await fetch("/api/v1/scan-face", {
          method: "POST",
          body: formData
        });

        const text = await response.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          data = { raw: text };
        }

        statusEl.textContent = "Status: " + response.status;
        resultEl.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        statusEl.textContent = "Request failed.";
        resultEl.textContent = String(error);
      }
    });
  </script>
</body>
</html>
