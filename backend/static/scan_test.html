<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guardian Collective — Face Scan</title>
  <style>
    :root {
      --bg:#f6f7f9; --panel:#ffffff; --fg:#16181d; --muted:#666c78; --line:#e2e5ea;
      --alert:#b3261e; --alert-bg:#fdeceb; --ok:#186b3c; --ok-bg:#e9f6ee;
      --unknown:#7a5c00; --unknown-bg:#fdf5e0; --accent:#1c4fd8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#131519; --panel:#1b1e24; --fg:#e9eaee; --muted:#9aa1ad; --line:#2b3038;
        --alert:#ff9a92; --alert-bg:#3a1c1a; --ok:#7fd4a0; --ok-bg:#14301f;
        --unknown:#e8c86a; --unknown-bg:#312713; --accent:#8fb0ff;
      }
    }
    * { box-sizing:border-box; }
    body {
      margin:0; padding:24px 16px 64px;
      font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
      background:var(--bg); color:var(--fg);
    }
    .wrap { max-width:820px; margin:0 auto; }
    header { margin-bottom:20px; }
    h1 { font-size:21px; margin:0 0 4px; letter-spacing:-.01em; }
    .sub { color:var(--muted); font-size:13px; margin:0; }

    .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; }
    .pad { padding:18px; }

    /* ---- upload ---- */
    #drop {
      border:2px dashed var(--line); border-radius:12px; padding:26px 18px;
      text-align:center; cursor:pointer; transition:border-color .15s, background .15s;
      background:var(--panel);
    }
    #drop:hover, #drop.over { border-color:var(--accent); }
    #drop p { margin:6px 0 0; color:var(--muted); font-size:13px; }
    #drop strong { font-size:15px; }
    #preview { display:none; max-height:220px; max-width:100%; border-radius:8px; margin-top:14px; }
    input[type=file] { display:none; }

    button {
      font:inherit; font-weight:600; padding:11px 20px; border-radius:8px; cursor:pointer;
      background:var(--fg); color:var(--bg); border:1px solid var(--fg);
    }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .row { display:flex; gap:12px; align-items:center; margin-top:14px; flex-wrap:wrap; }

    /* ---- status ---- */
    #status { font-size:13px; color:var(--muted); min-height:20px; }
    .spin {
      display:inline-block; width:13px; height:13px; margin-right:7px; vertical-align:-2px;
      border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%;
      animation:spin .7s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ---- verdict ---- */
    #result { margin-top:20px; display:none; }
    .verdict { border-radius:12px; padding:18px; border:1px solid; margin-bottom:16px; }
    .verdict.alert   { background:var(--alert-bg);   border-color:var(--alert);   color:var(--alert); }
    .verdict.ok      { background:var(--ok-bg);      border-color:var(--ok);      color:var(--ok); }
    .verdict.unknown { background:var(--unknown-bg); border-color:var(--unknown); color:var(--unknown); }
    .verdict h2 { margin:0; font-size:19px; letter-spacing:-.01em; }
    .verdict .who { margin:8px 0 0; font-size:15px; font-weight:600; color:var(--fg); }
    .verdict .note { margin:6px 0 0; font-size:13px; color:var(--muted); }

    .badge {
      display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase;
      letter-spacing:.05em; padding:3px 8px; border-radius:5px; vertical-align:2px; margin-left:8px;
    }
    .badge.offender,.badge.suspect { background:var(--alert); color:var(--panel); }
    .badge.verified { background:var(--ok); color:var(--panel); }

    h3 { font-size:12px; text-transform:uppercase; letter-spacing:.06em;
         color:var(--muted); margin:0 0 12px; font-weight:700; }
    .card + .card { margin-top:14px; }

    .meter { height:7px; background:var(--line); border-radius:4px; overflow:hidden; margin:8px 0 6px; }
    .meter i { display:block; height:100%; border-radius:4px; }
    .kv { display:flex; justify-content:space-between; gap:14px; font-size:13px; padding:5px 0;
          border-bottom:1px solid var(--line); }
    .kv:last-child { border-bottom:0; }
    .kv span:first-child { color:var(--muted); }
    .kv span:last-child { font-variant-numeric:tabular-nums; text-align:right; }

    .cap { border:1px solid var(--line); border-radius:9px; padding:11px 13px; margin-bottom:9px; }
    .cap:last-child { margin-bottom:0; }
    .cap .top { display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
    .cap .dist { font-variant-numeric:tabular-nums; font-weight:700; }
    .cap .meta { font-size:12px; color:var(--muted); margin-top:5px; word-break:break-word; }
    .tick { color:var(--ok); font-weight:700; }
    .cross { color:var(--muted); font-weight:700; }

    .warn { font-size:13px; padding:9px 12px; border-radius:8px;
            background:var(--unknown-bg); color:var(--unknown); margin-top:9px; }
    .imgnote { font-size:12px; color:var(--muted); font-style:italic; }
    details { margin-top:14px; }
    summary { cursor:pointer; font-size:12px; color:var(--muted); }
    pre { background:var(--bg); border:1px solid var(--line); padding:11px; border-radius:8px;
          font-size:11px; overflow-x:auto; margin:8px 0 0; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Face Scan</h1>
    <p class="sub">Upload a face to check it against the identity registry. <a href="/demos">All demos</a> · <a href="/test-azure-plate">Image to Text</a></p>
  </header>

  <div id="drop">
    <strong>Drop a photo here, or click to choose</strong>
    <p>The largest face in the image is the one that gets scanned.</p>
    <img id="preview" alt="selected image preview">
  </div>
  <input id="file" type="file" accept="image/*">

  <div class="row">
    <button id="scan" disabled>Scan face</button>
    <span id="status"></span>
  </div>

  <div id="result"></div>
</div>

<script>
  const fileEl = document.getElementById("file");
  const dropEl = document.getElementById("drop");
  const previewEl = document.getElementById("preview");
  const scanEl = document.getElementById("scan");
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("result");

  let timer = null;

  dropEl.addEventListener("click", () => fileEl.click());
  dropEl.addEventListener("dragover", e => { e.preventDefault(); dropEl.classList.add("over"); });
  dropEl.addEventListener("dragleave", () => dropEl.classList.remove("over"));
  dropEl.addEventListener("drop", e => {
    e.preventDefault();
    dropEl.classList.remove("over");
    if (e.dataTransfer.files.length) { fileEl.files = e.dataTransfer.files; showPreview(); }
  });
  fileEl.addEventListener("change", showPreview);

  function showPreview() {
    const f = fileEl.files && fileEl.files[0];
    if (!f) return;
    previewEl.src = URL.createObjectURL(f);
    previewEl.style.display = "block";
    scanEl.disabled = false;
    statusEl.textContent = "";
    resultEl.style.display = "none";
  }

  const esc = v => String(v ?? "").replace(/[&<>"]/g,
    c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  const row = (k, v) => (v === undefined || v === null || v === "")
    ? "" : `<div class="kv"><span>${esc(k)}</span><span>${esc(v)}</span></div>`;

  function fmtWhen(iso) {
    if (!iso) return null;
    try { return new Date(iso).toLocaleString(); } catch { return iso; }
  }

  // Distance is cosine: 0 is identical, and the match threshold is 0.30. Invert it
  // into a 0-100% "confidence" purely so the bar reads the intuitive way round.
  function confidencePct(distance) {
    if (distance === null || distance === undefined) return 0;
    return Math.max(0, Math.min(100, Math.round((1 - distance / 0.6) * 100)));
  }

  function qualityBlock(q) {
    if (!q) return "";
    const pct = Math.round(q.quality_score * 100);
    const colour = q.quality_score >= 0.7 ? "var(--ok)"
                 : q.quality_score >= 0.45 ? "var(--unknown)" : "var(--alert)";
    let warn = "";
    if (q.reasons && q.reasons.length) {
      warn = `<div class="warn"><strong>Image quality is marginal.</strong> The scan still ran —
              this is advisory — but treat the result with caution:<br>&bull; ${
                q.reasons.map(esc).join("<br>&bull; ")}</div>`;
    }
    return `<div class="card pad">
      <h3>Image quality</h3>
      <div class="meter"><i style="width:${pct}%;background:${colour}"></i></div>
      ${row("Overall score", q.quality_score)}
      ${row("Face size", q.face_pixels + " px across")}
      ${row("Sharpness", q.blur_variance)}
      ${row("Edge balance (motion blur)", q.blur_directional_ratio)}
      ${row("Detector confidence", q.det_confidence)}
      ${warn}
    </div>`;
  }

  function capturesBlock(data) {
    const caps = data.supporting_captures || [];
    if (!caps.length) return "";
    const items = caps.map(c => {
      const bits = [];
      if (c.source) bits.push("source: " + esc(c.source));
      if (c.camera_id) bits.push("camera: " + esc(c.camera_id));
      const when = fmtWhen(c.captured_at);
      if (when) bits.push("captured: " + esc(when));
      if (c.incident_ref) bits.push("incident: " + esc(c.incident_ref));
      if (c.quality_score !== null && c.quality_score !== undefined)
        bits.push("quality: " + esc(c.quality_score));
      return `<div class="cap">
        <div class="top">
          <span>${c.agrees ? '<span class="tick">&#10003; agrees</span>'
                           : '<span class="cross">&#8212; too far</span>'}</span>
          <span class="dist">${esc(c.distance)}</span>
        </div>
        <div class="meta">${bits.join(" &nbsp;·&nbsp; ") || "no capture details recorded"}</div>
      </div>`;
    }).join("");
    return `<div class="card pad">
      <h3>Sightings supporting this match &mdash; ${data.agreeing_captures} of ${caps.length} agree</h3>
      ${items}
    </div>`;
  }

  // The verdict above describes ONE face — the most significant one. When the
  // image held more, listing the rest is not a nicety: "faces found: 3" over a
  // single verdict reads as though the other two were checked and cleared.
  function otherFacesBlock(data) {
    const others = (data.faces || []).filter(f => !f.is_primary);
    if (!others.length) return "";
    const items = others.map(f => {
      const p = f.person || {};
      const box = f.facial_area || {};
      const who = f.is_known_user
        ? `${esc(p.full_name)}<span class="badge ${esc(p.status)}">${esc(p.status)}</span>`
        : "Not in the registry";
      return `<div class="cap">
        <div class="top">
          <span>${f.alert ? '<span class="cross">&#9888; flagged</span>'
                : f.is_known_user ? '<span class="tick">&#10003; known</span>'
                : '<span>&#8212; unknown</span>'} ${who}</span>
          <span class="dist">${esc(f.match_distance)}</span>
        </div>
        <div class="meta">box ${esc(box.w)}&times;${esc(box.h)} at
          (${esc(box.x)}, ${esc(box.y)}) &nbsp;·&nbsp; quality:
          ${esc((f.capture_quality || {}).quality_score)}</div>
      </div>`;
    }).join("");
    return `<div class="card pad">
      <h3>Other faces in this image &mdash; ${others.length}</h3>
      ${items}
    </div>`;
  }

  function render(data, httpStatus, elapsed) {
    resultEl.style.display = "block";

    // No face found at all.
    if (data.success === false || data.error) {
      resultEl.innerHTML = `
        <div class="verdict unknown">
          <h2>No face detected</h2>
          <p class="note">${esc(data.error || "The scan could not be completed.")}</p>
        </div>
        <div class="card pad">
          ${row("HTTP status", httpStatus)}
          ${row("Time taken", elapsed + " s")}
        </div>
        <details><summary>Raw response</summary><pre>${esc(JSON.stringify(data, null, 2))}</pre></details>`;
      return;
    }

    const person = data.person || {};
    let cls, heading, who = "", note = "";

    if (data.alert) {
      cls = "alert";
      heading = `&#9888; ${esc((person.status || "").toUpperCase())} DETECTED`;
      who = `${esc(person.full_name)}<span class="badge ${esc(person.status)}">${esc(person.status)}</span>`;
      note = "This person is flagged in the registry. Alert conditions met.";
    } else if (data.is_known_user) {
      cls = "ok";
      heading = "&#10003; Recognised";
      who = `${esc(person.full_name)}<span class="badge verified">verified</span>`;
      note = "Known to the registry. No alert raised.";
    } else {
      cls = "unknown";
      heading = "Not in the registry";
      note = "This face does not match anyone on record. Nothing was saved — "
           + "adding someone is a separate, deliberate action.";
      if (data.nearest_person) {
        note += ` Closest record was ${esc(data.nearest_person.full_name)} at ${esc(data.match_distance)}, `
              + "which is beyond the match threshold.";
      }
    }

    const pct = confidencePct(data.match_distance);
    const barColour = data.alert ? "var(--alert)" : data.is_known_user ? "var(--ok)" : "var(--muted)";

    // A narrow margin means the scan sat almost equally close to two different
    // people. Surfacing it is the difference between a decisive match and a
    // coin-flip that happened to land the right way.
    let marginWarn = "";
    if (data.is_known_user && data.margin_to_next_person !== null
        && data.margin_to_next_person !== undefined && data.margin_to_next_person < 0.10) {
      marginWarn = `<div class="warn"><strong>Close call.</strong> The next-closest person is only
        ${esc(data.margin_to_next_person)} further away. Worth a human check.</div>`;
    }

    let photo = "";
    if (person.image_url) {
      // The blob container is private, so this usually 409s. Fail gracefully
      // rather than showing a broken image icon.
      photo = `<img src="${esc(person.image_url)}" alt="stored reference photo"
                 style="max-height:150px;border-radius:8px;margin-bottom:10px"
                 onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
               <p class="imgnote" style="display:none">Stored photo could not be loaded &mdash;
                 the blob container is private.</p>`;
    }

    resultEl.innerHTML = `
      <div class="verdict ${cls}">
        <h2>${heading}</h2>
        ${who ? `<p class="who">${who}</p>` : ""}
        <p class="note">${note}</p>
      </div>

      ${data.is_known_user ? `<div class="card pad">
        <h3>How certain</h3>
        ${photo}
        <div class="meter"><i style="width:${pct}%;background:${barColour}"></i></div>
        ${row("Match distance", data.match_distance + "  (threshold 0.30, lower is better)")}
        ${row("References compared", data.matched_against_photos)}
        ${row("Margin to next person", data.margin_to_next_person)}
        ${row("Next closest person", data.next_closest_person
            ? `${data.next_closest_person.full_name} (${data.next_closest_person.distance})` : null)}
        ${marginWarn}
      </div>` : ""}

      ${otherFacesBlock(data)}
      ${capturesBlock(data)}
      ${qualityBlock(data.capture_quality)}

      <div class="card pad">
        <h3>Scan details</h3>
        ${row("Faces found in image", data.faces_detected)}
        ${row("Faces identified", data.faces_resolved)}
        ${row("Faces not identified (over cap)", data.faces_truncated || 0)}
        ${row("Time taken", elapsed + " s")}
        ${row("HTTP status", httpStatus)}
      </div>

      <details><summary>Raw response</summary><pre>${esc(JSON.stringify(data, null, 2))}</pre></details>`;
  }

  scanEl.addEventListener("click", async () => {
    if (!fileEl.files || !fileEl.files.length) return;
    scanEl.disabled = true;
    resultEl.style.display = "none";

    // Scans take ~25s on CPU. Without a running clock this reads as a hung page.
    const started = Date.now();
    const tick = () => {
      const s = ((Date.now() - started) / 1000).toFixed(1);
      statusEl.innerHTML = `<span class="spin"></span>Analysing face… ${s}s`;
    };
    tick();
    timer = setInterval(tick, 100);

    const fd = new FormData();
    fd.append("file", fileEl.files[0]);

    try {
      const res = await fetch("/api/v1/scan-face", { method:"POST", body:fd });
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); }
      catch { data = { success:false, error:"Server returned a non-JSON response", raw:text }; }
      const elapsed = ((Date.now() - started) / 1000).toFixed(1);
      render(data, res.status, elapsed);
      statusEl.textContent = "";
    } catch (err) {
      statusEl.textContent = "";
      resultEl.style.display = "block";
      resultEl.innerHTML = `<div class="verdict unknown"><h2>Request failed</h2>
        <p class="note">${esc(err)}</p></div>`;
    } finally {
      clearInterval(timer);
      scanEl.disabled = false;
    }
  });
</script>
</body>
</html>
