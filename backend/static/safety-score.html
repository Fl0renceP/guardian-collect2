<!doctype html>
<html>
<head>
<title>Guardian Collective - Safety Score</title>

<style>
body {
    font-family: Arial, sans-serif;
    background:#f5f5f7;
    padding:40px;
}

.card {
    background:white;
    border-radius:20px;
    padding:30px;
    max-width:500px;
    margin:auto;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.score {
    font-size:70px;
    font-weight:bold;
    text-align:center;
}

.high {
    color:red;
}

.low {
    color:green;
}

.medium {
    color:orange;
}

.reason {
    background:#f2f2f2;
    padding:10px;
    margin:8px 0;
    border-radius:10px;
}
</style>

</head>


<body>

<div class="card">

<h1>Guardian Safety Score</h1>


<label>
Claim ID:
</label>

<input id="claim" value="INC-001">


<button onclick="loadScore()">
Check Safety Score
</button>


<div id="result"></div>


</div>


<script>

function loadScore(){

let id=document.getElementById("claim").value;


fetch("/api/safety-score/"+id)

.then(res=>res.json())

.then(data=>{


document.getElementById("result").innerHTML=`

<div class="score ${data.risk_level.toLowerCase()}">
${data.score}
</div>


<h2>
Risk Level: ${data.risk_level}
</h2>


<h3>Reasons:</h3>

${data.reasons.map(r=>`
<div class="reason">
${r}
</div>
`).join("")}


`;

});


}

</script>


</body>
</html>
